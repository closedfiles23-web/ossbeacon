name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe reproduction you can provide.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OSSBeacon version
      placeholder: 0.1.0
  - type: dropdown
    id: ai
    attributes:
      label: Was AI mode enabled?
      options: ["No", "Yes"]

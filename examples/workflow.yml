name: OSSBeacon PR signal
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: closedfiles23-web/ossbeacon@v0.2.0
        with:
          github-token: ${{ github.token }}
          use-ai: 'false'
          comment: 'false'
